name: migrate-and-deploy
on:
  workflow_dispatch:
    inputs:
      fail_migration:
        description: Simulate a failed migration
        type: boolean
        default: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TARGET_READ_TOKEN }}
      REPO: yokeTH/dispatch-poc-target
    steps:
      - run: |
          url=$(gh workflow run migrate.yml -R "$REPO" -f fail=${{ inputs.fail_migration }})
          echo "migration run: $url"
          gh run watch "${url##*/}" -R "$REPO" --exit-status
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "mock deploy after migration"
          sleep 5
          echo "deployed"