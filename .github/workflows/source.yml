name: source
on:
  workflow_dispatch:
    inputs:
      message:
        description: Message to send to the target workflow
        default: hello from source
jobs:
  build:
    uses: yokeTH/dispatch-poc-target/.github/workflows/target.yml@main
    secrets: inherit
    with:
      message: ${{ inputs.message }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "mock deploy: ${{ needs.build.outputs.artifact }}"
          sleep 5
          echo "deployed"
